<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Templator for AIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Manrope:wght@400..800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F9; --stage:#E8ECF2; --dot:#D3D9E2;
  --panel:#FFFFFF; --panel-2:#F7F8FB; --line:#E6E9EF; --line-2:#EEF1F5;
  --ink:#1F2A37; --ink-2:#5B6472; --ink-3:#8A93A2;
  --accent:#D31145; --accent-ink:#FFFFFF; --accent-soft:#FCE8EE; --accent-line:#F4A9BE;
  --ok:#1FA05A; --ok-soft:#E4F6EC; --warn:#9A6200; --warn-soft:#FFF3DD; --bad:#B00D3A; --bad-soft:#FCE8EE;
  --lock:#4B5A8A; --lock-soft:#E8ECF7; --brand:#B00D3A; --brand-soft:#FFF5F7;
  --shadow:0 1px 2px rgba(31,42,55,.05),0 10px 30px -18px rgba(31,42,55,.25);
  --ui:'Instrument Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"top top top top" "rail left stage rrail"}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.wordmark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.glyphimg{width:28px;height:28px;display:block}
.wordmark .glyph{width:22px;height:22px;border-radius:5px;background:var(--ink);position:relative}
.wordmark .glyph::before{content:"";position:absolute;inset:5px 5px 9px 5px;border:1.5px dashed var(--accent);border-radius:2px}
.wordmark .glyph::after{content:"";position:absolute;left:5px;right:9px;bottom:5px;height:2px;background:var(--bg);border-radius:1px}
.crumb{color:var(--ink-3);font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:500;white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.seg .dim{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}
@media (max-width:1560px){.top .seg .dim{display:none}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#E0234F,var(--accent));border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -8px rgba(211,17,69,.7)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn svg,.tb svg,.ico{width:15px;height:15px;flex:none}
.iconbtn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent;background:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Rail and drawers */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:var(--panel);border-right:1px solid var(--line);width:72px;box-sizing:border-box}
.rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;border-radius:10px;padding:9px 2px 7px;font-size:11px;font-weight:600;color:var(--ink-2)}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:var(--panel-2);color:var(--ink)}
.rail button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rail .rbadge{position:absolute;top:4px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}
.rail .rbadge.ok{background:var(--ok)}
.rrail{grid-area:rrail;display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:var(--panel);border-left:1px solid var(--line);width:72px;box-sizing:border-box}
.rrail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;border-radius:10px;padding:9px 2px 7px;font-size:11px;font-weight:600;color:var(--ink-2)}
.rrail button svg{width:20px;height:20px}
.rrail button:hover:not(:disabled){background:var(--panel-2);color:var(--ink)}
.rrail button:disabled{opacity:.4;cursor:not-allowed}
.rrail button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rrail .rbadge{position:absolute;top:4px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}
.app.formmode.has-rpanel .formview{padding-right:370px;max-width:1130px}
.ldrawer{grid-area:left;width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp{grid-area:stage;justify-self:end;align-self:stretch;z-index:26;width:348px;box-shadow:-12px 0 32px -24px rgba(31,42,55,.35)}
.app:not(.formmode) .stage-inner{padding-right:392px}
.secgroup{display:flex;flex-direction:column;gap:16px}
.ctlrow{display:flex;flex-direction:column;gap:6px}
.seg.wrap{flex-wrap:wrap}
.quick-row{padding-bottom:2px}
.quick-row .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* the properties panel is read by agents of all ages: larger, darker labels and bigger targets */
.insp{font-size:14px}
.insp .dhead h2{font-size:16px}
.insp .ctlrow > .muted,.insp .field label,.insp .slider label,.insp .bsec > .muted{font-size:13px;font-weight:600;color:var(--ink-2)}
.insp .sec > h2{font-size:12px;color:var(--ink-2)}
.insp .seg button{padding:8px 13px;font-size:13.5px}
.insp .seg button svg{width:17px;height:17px}
.insp .btn.sm{padding:8px 12px;font-size:13px}
.insp .swatches{gap:8px}
.insp .swatches .sw{width:30px;height:30px}
.insp .swatches .sw.auto{height:30px;border-radius:15px;font-size:12px}
.insp .field textarea,.insp .field input[type=text]{font-size:15px}
.insp .meterline{font-family:var(--ui);font-size:12.5px;color:var(--ink-2)}
.insp .muted{font-size:13px}
.insp details.fold > summary{font-size:14px;color:var(--ink)}
.insp .quick button,.insp .ai-cta{font-size:13.5px}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line-2)}
.dhead h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldrawer .dhead h2{flex:1}
.dscroll{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}
#libBody{display:block}
#libBody[hidden]{display:none!important}
.iconbtn.ghosticon{border-color:transparent;background:transparent}
.iconbtn.ghosticon:hover:not(:disabled){background:var(--panel-2)}
.lib h2,.insp h2.lab,.sec > h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
.cat{margin-top:4px;margin-bottom:14px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cat-head span{font-size:13px;font-weight:600}
.cat-head small{color:var(--ink-3);font-family:var(--mono);font-size:10.5px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tcard:hover{border-color:var(--ink-3)}
.tcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tthumb{position:relative;overflow:hidden;border-radius:5px;background:var(--line-2)}
.tthumb > .cv{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.tcard .tname{font-size:11.5px;font-weight:500;line-height:1.25}
.lib-note{margin-top:18px;font-size:11.5px;color:var(--ink-3)}

/* Stage */
.stage{grid-area:stage;position:relative;overflow:hidden;background-color:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;display:flex;flex-direction:column;min-height:0}
.stage-inner{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:64px 32px 24px}
.frame{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.18);border-radius:2px}
.frame > .cv{position:absolute;left:0;top:0;transform-origin:0 0}
@media (min-width:901px){body .toast{top:66px;bottom:auto}}
.stage-foot2{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 32px 14px}
.app:not(.formmode) .stage-foot2{padding-right:392px}
.addfab{padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);border-color:var(--accent-line);color:var(--accent)}
.addfab:hover,.addfab[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.addfab svg{width:17px;height:17px}
.stage-hint{text-align:center;color:var(--ink-3);font-size:12px}
#addMenu{width:min(600px,calc(100vw - 16px))}
#addMenu .kitlist{display:flex;flex-direction:column;gap:4px;padding:6px}
#addMenu .kitlist .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
#addMenu .kitlist button{flex-direction:row;align-items:center;gap:8px;padding:7px 8px}
#addMenu .kitlist .mi{width:28px;height:28px;flex:none}
#addMenu .kitlist b{font-size:12.5px}
@media (max-width:640px){#addMenu .kitlist .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 5px;color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:13px;align-items:center}
.keys dt{white-space:nowrap}.keys dd{margin:0;color:var(--ink-2)}
.size-tag{position:absolute;left:0;top:-22px;font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.preview-tag{position:absolute;right:0;top:-24px;font-size:11px;font-weight:600;color:var(--accent);display:flex;gap:6px;align-items:center}

/* Floating toolbar */
.tb{position:absolute;z-index:20;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;white-space:nowrap;max-width:calc(100% - 16px);overflow-x:auto}
.tb[hidden]{display:none!important}
.tb button{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--ink)}
.tb button:hover{background:var(--panel-2)}
.tb button[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.tb button:disabled{opacity:.4;cursor:not-allowed}
.tb .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 4px}
.tb .ai{color:var(--accent);font-weight:600}
.tb .ai:hover{background:var(--accent-soft)}
.tb .tag{font-size:12px;padding:5px 9px;border-radius:7px;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.tb .tag.lock{background:var(--lock-soft);color:var(--lock)}
.tb .tag.brand{background:var(--brand-soft);color:var(--brand)}
.tb .slotname{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:0 8px 0 6px}
.pop{position:absolute;z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;min-width:200px}
.pop[hidden]{display:none!important}
.pop .opt{display:flex;width:100%;border:0;background:transparent;padding:7px 9px;border-radius:6px;text-align:left;justify-content:space-between;gap:12px}
.pop .opt:hover{background:var(--panel-2)}
.pop .opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.pop label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:6px}
.focal{display:grid;grid-template-columns:repeat(3,28px);gap:4px}
.focal button{width:28px;height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;display:grid;place-items:center}
.focal button::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.focal button[aria-pressed="true"]{border-color:var(--accent)}
.focal button[aria-pressed="true"]::after{background:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}

/* Creative element states (editor only) */
.cv.interactive .cv-slot{cursor:pointer}
.cv.interactive .cv-slot:hover{outline:calc(2px * var(--inv)) solid var(--accent-line);outline-offset:calc(3px * var(--inv))}
.cv.interactive .cv-slot.is-selected{outline:calc(2.5px * var(--inv)) solid var(--accent);outline-offset:calc(3px * var(--inv))}
.cv.interactive .cv-slot[data-lock="locked"]{cursor:not-allowed}
.cv.interactive .cv-slot[data-lock="locked"]:hover,.cv.interactive .cv-slot[data-lock="locked"].is-selected{outline:calc(2px * var(--inv)) dashed var(--lock);outline-offset:calc(3px * var(--inv))}
.cv.interactive .cv-slot[data-lock="brand"]:hover,.cv.interactive .cv-slot[data-lock="brand"].is-selected{outline-color:var(--brand)}
.cv.interactive .cv-slot.is-invalid{outline:calc(2px * var(--inv)) dashed var(--bad)!important;outline-offset:calc(3px * var(--inv))}
.cv.interactive .cv-slot.is-preview{outline:calc(2.5px * var(--inv)) dashed var(--accent)!important;outline-offset:calc(4px * var(--inv));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:var(--accent-line)}}
.cv.interactive .cv-slot[data-lock="locked"]:hover::after{content:"Locked by Compliance";position:absolute;right:0;top:calc(-30px * var(--inv));font:600 calc(11px * var(--inv))/1 var(--ui);letter-spacing:0;text-transform:none;background:var(--lock);color:#fff;padding:calc(5px * var(--inv)) calc(8px * var(--inv));border-radius:calc(5px * var(--inv));white-space:nowrap;z-index:5}
.cv.interactive .cv-image.is-selected{cursor:grab}
.cv.interactive .cv-slot.is-selected[data-movable]{cursor:move}
.cv.interactive .cv-slot.is-moving{cursor:grabbing;opacity:.92}
.frame.snap-x::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--accent);pointer-events:none;z-index:3}
.frame.snap-home::after{content:"Snapped to template position";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:min(420px,calc(100vw - 16px));max-height:calc(100vh - 90px);overflow:auto}
.menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.menu[hidden]{display:none!important}
.menu button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--panel-2)}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu .mi{width:34px;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center}
.menu b{display:block;font-size:13px;font-weight:600}
.menu small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.3}
.menu .foot{font-size:11.5px;color:var(--ink-3);padding:8px 8px 4px;border-top:1px solid var(--line-2);margin-top:4px}
.tb .dotbtn{width:18px;height:18px;border-radius:50%;padding:0!important;border:2px solid var(--line)!important;display:inline-block}
.tb .dotbtn[aria-pressed="true"]{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent-soft)}
.tb .icn svg{width:16px;height:16px}
.tb .cdot,.cdot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:inline-block}
.frame.snap-y::before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--accent);pointer-events:none;z-index:3}
.rot-handle{position:absolute;z-index:22;width:30px;height:30px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;cursor:grab;box-shadow:var(--shadow);padding:0;touch-action:none}
.rot-handle[hidden]{display:none!important}
.rot-handle svg{width:15px;height:15px}
.rot-handle.on{cursor:grabbing;background:var(--accent);color:var(--accent-ink)}
.rot-handle.on::after{content:attr(data-deg);position:absolute;top:36px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);font:600 11px/1 var(--mono);padding:4px 6px;border-radius:5px;white-space:nowrap}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.swatches .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swatches .sw.auto{width:auto;padding:0 9px;border-radius:13px;font-size:11px;background:var(--panel-2);color:var(--ink-2)}
.pop .swatches{max-width:236px}
.icongrid{display:grid;grid-template-columns:repeat(5,36px);gap:6px}
.icongrid button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);display:grid;place-items:center;color:var(--ink);padding:0}
.icongrid button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slider label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.cv.interactive .cv-image.is-panning{cursor:grabbing}
.cv [contenteditable]{outline:none;cursor:text;caret-color:var(--accent)}
.cv .is-editing{outline:calc(2.5px * var(--inv)) solid var(--accent)!important;outline-offset:calc(3px * var(--inv));background:rgba(255,255,255,.06)}

/* Creative base */
.cv{overflow:hidden;position:relative}
.cv *{box-sizing:border-box}
.cv-abs{position:absolute}
.cv-col{position:absolute;display:flex;flex-direction:column;overflow:visible}
.cv-slot{position:relative}
.cv .cv-abs{position:absolute}
.cv-text{margin:0;overflow-wrap:break-word}
.cv-cta{display:inline-flex;align-items:center;border-radius:999px;white-space:nowrap;font-weight:700;letter-spacing:.01em}
.cv-logo{display:flex;align-items:center;gap:.42em;line-height:1}
.cv-logo .mk{width:1.45em;height:1.6em;border:.2em solid currentColor;border-bottom-width:0;border-radius:.8em .8em 0 0;position:relative}
.cv-logo .mk::after{content:"";position:absolute;left:50%;bottom:0;width:.34em;height:.55em;margin-left:-.17em;background:currentColor;border-radius:.17em .17em 0 0}
.cv-logo .wm{display:flex;flex-direction:column;gap:.18em}
.cv-logo .wm b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.12em;letter-spacing:-.01em}
.cv-logo .wm i{font-style:normal;font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:.36em;letter-spacing:.34em}

/* Inspector */
.insp{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 10px 10px;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs .count{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink-2)}
.insp-body{flex:1;overflow:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{border-top:1px solid var(--line-2);padding-top:16px}
.slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.slot-head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.slot-head code{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.editable{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.ai{background:var(--accent-soft);color:var(--accent)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.locked{background:var(--lock-soft);color:var(--lock)}
.chip.claude{background:var(--ok-soft);color:var(--ok)}
.chip.demo{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;resize:vertical;line-height:1.45}
.field textarea:focus,.field input[type=text]:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{font-size:11.5px;color:var(--ink-2)}
.meter .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.meter .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.meter.over .bar i{background:var(--bad)}
.meter.over .row b{color:var(--bad)}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
.issues li.warn{background:var(--warn-soft);color:var(--warn)}
.issues li.ok{background:var(--ok-soft);color:var(--ok)}
.issues li button{margin-left:auto;border:0;background:transparent;color:inherit;text-decoration:underline;font-size:12px;padding:0}
.ai-box{border:1px solid var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),transparent 70%);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-head h4{margin:0;font-size:13px;display:flex;gap:6px;align-items:center;color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:12px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.quick button:disabled{opacity:.5;cursor:not-allowed}
.ask{display:flex;gap:6px;align-items:flex-end}
.ask textarea{flex:1;min-height:40px;max-height:120px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;resize:none}
.ask textarea:focus{outline:none;border-color:var(--accent)}
.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:9px}
.result .proposal{font-size:15px;line-height:1.35;font-weight:500}
.result .why{font-size:12px;color:var(--ink-2)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks span{font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok)}
.checks span.no{background:var(--bad-soft);color:var(--bad)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
details.json summary{cursor:pointer;font-size:12px;color:var(--ink-2)}
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0 0;white-space:pre;max-height:420px}
pre.code .k{color:var(--brand)} pre.code .s{color:var(--ok)} pre.code .n{color:var(--accent)} pre.code .b{color:var(--lock)}
.thinking{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.libgrid button{border:1px solid var(--line);padding:0;border-radius:7px;overflow:hidden;background:var(--panel-2);aspect-ratio:4/3;position:relative}
.libgrid button img{width:100%;height:100%;object-fit:cover;display:block}
.libgrid button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.libgrid .up{display:grid;place-items:center;font-size:11.5px;color:var(--ink-2);gap:2px;text-align:center}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts2 button{border:1px solid var(--line);border-radius:9px;padding:0;overflow:hidden;background:var(--panel-2);position:relative}
.opts2 button img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.opts2 button span{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 6px}
.opts2 button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.muted{color:var(--ink-3);font-size:12px}
.note{font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.varline{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:11px;color:var(--ink-3)}
.locked-text{font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:8px;background:var(--lock-soft);color:var(--ink)}
.variants{display:flex;gap:8px}
.variants button{flex:1;border:1px solid var(--line);border-radius:9px;padding:14px 8px;display:grid;place-items:center;font-size:13px}
.variants button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.variants .sw-color{background:#FFFFFF;color:#D31145}
.variants .sw-white{background:#D31145;color:#fff}

/* Versions */
.vlist{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none;position:relative}
.vitem{display:grid;grid-template-columns:52px 1fr;gap:11px;padding:10px 0;border-top:1px solid var(--line-2);align-items:start}
.vitem:first-child{border-top:0}
.vthumb{position:relative;overflow:hidden;border-radius:4px;background:var(--line-2);border:1px solid var(--line)}
.vthumb > .cv{position:absolute;left:0;top:0;transform-origin:0 0}
.vmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.vmeta .l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vmeta b{font-size:13px;font-weight:600}
.vmeta .seq{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.vmeta .src{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.vmeta .src.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.vmeta .src.appr{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.vmeta .ins{font-size:12px;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.vmeta .l3{display:flex;gap:6px;margin-top:3px}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.flow span{padding:2px 7px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.flow i{font-style:normal;color:var(--ink-3)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;display:grid;place-items:center;padding:16px}
.scrim[hidden]{display:none!important}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(920px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.modal header h3{margin:0;font-size:15px}
.modal .mbody{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}
.exp-prev{background-color:var(--stage);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:14px 14px;border-radius:10px;display:grid;place-items:center;padding:18px;min-height:280px}
.exp-prev img{max-width:100%;max-height:56vh;box-shadow:0 12px 40px rgba(0,0,0,.25);display:block}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.steps li .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.steps li.run{color:var(--ink)} .steps li.run .st{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)} .steps li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.fail{color:var(--bad)} .steps li.fail .st{background:var(--bad);border-color:var(--bad);color:#fff}
.steps li .st svg{width:11px;height:11px}
.varx{padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.varcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2)}
.varcard .vt{position:relative;overflow:hidden;border-radius:6px}
.varcard .vt > .cv{position:absolute;left:0;top:0;transform-origin:0 0}
.varcard .tone{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.varcard .bad{font-size:11.5px;color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:12.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
#measureHost{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}
#exportHost{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1}

@media (max-width: 1100px){
  .ldrawer{width:270px}.insp{width:320px}
  .app:not(.formmode) .stage-inner,.app:not(.formmode) .stage-foot2{padding-right:352px}
}
@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto;display:flex;flex-direction:column}
  .stage-inner,.app:not(.formmode) .stage-inner{padding:48px 16px 16px;min-height:0}
  .modal .mbody{grid-template-columns:1fr}
  .varx{grid-template-columns:1fr}
}

[hidden]{display:none!important}
.protobadge{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.btn.lg{padding:10px 16px;font-size:13.5px;border-radius:9px}
.btn.accent-outline{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.btn.accent-outline:hover{background:var(--accent-soft)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.view{min-height:100%;background:var(--bg)}
.apptop{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brandblk{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.brandblk b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brandblk small{display:block;font-size:11.5px;color:var(--ink-3)}
.navtabs{display:flex;gap:2px;margin-left:18px}
.navtabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
.navtabs button:hover{color:var(--ink)}
.navtabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.iconbtn.bell{position:relative;border-radius:50%;border-color:transparent}
.iconbtn.bell .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--panel)}
.who{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 10px 4px 4px;border-radius:999px}
.who:hover{background:var(--panel-2)}
.who .av{width:34px;height:34px;border-radius:50%;background:#ddd center 18%/cover no-repeat;box-shadow:0 0 0 2px var(--accent-soft)}
.who .t{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.who .t b{font-size:12.5px}.who .t small{font-size:11px;color:var(--ink-3)}
.page{max-width:1320px;margin:0 auto;padding:26px 24px 64px;display:flex;flex-direction:column;gap:28px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hello h1{margin:0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechead h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sechead h3{margin:0}
.purposes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.purpose{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
.purpose:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.purpose .pi{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.purpose b{display:block;font-size:13.5px}.purpose small{display:block;color:var(--ink-3);font-size:12px;line-height:1.35}
.purpose[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.svgico{display:inline-grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;min-width:240px;color:var(--ink-3)}
.search input{border:0;background:none;padding:8px 0;flex:1;min-width:0;color:var(--ink)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
.sechead select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips .n{font-family:var(--mono);font-size:11px;margin-left:6px;opacity:.75}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:border-color .12s,transform .12s}
.pcard:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.pthumb{height:262px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--line)}
.pthumb .holder{position:relative;box-shadow:0 10px 26px -12px rgba(31,42,55,.45)}
.pthumb .holder > .cv{position:absolute;left:0;top:0;transform-origin:0 0}
.pmeta{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pmeta .nm{font-weight:700;font-size:13.5px;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.pmeta .nm:hover{color:var(--accent)}
.pmeta .sub{font-size:12px;color:var(--ink-3)}
.pmeta .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.more{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.96);display:grid;place-items:center;color:var(--ink-2)}
.more:hover{color:var(--accent);border-color:var(--accent-line)}
.newcard{border:1.5px dashed var(--line-2);background:transparent;box-shadow:none;align-items:center;justify-content:center;gap:8px;min-height:340px;color:var(--ink-2)}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.newcard .plus{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.newcard small{color:var(--ink-3)}
.empty{grid-column:1/-1;padding:40px;text-align:center;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.status.draft{background:var(--panel-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.status.review{background:var(--warn-soft);color:var(--warn)}
.status.approved{background:var(--ok-soft);color:var(--ok)}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ctx{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:220px;max-height:70vh;overflow:auto}
.ctx > button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:12.5px}
.ctx > button:hover{background:var(--panel-2)}
.ctx .danger{color:var(--bad)}
.ctx .ctxhead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px 4px}
.ctx .note{flex-direction:column;align-items:flex-start;gap:2px}
.ctx .note.unread{background:var(--accent-soft)}
.ctx .note small{color:var(--ink-3)}
.crhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crhead h1{margin:0;font-size:24px;letter-spacing:-.02em}
.steps3{display:flex;gap:6px;margin:0 0 0 auto;padding:0;list-style:none;counter-reset:s}
.steps3 li{counter-increment:s;font-size:12px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.steps3 li::before{content:counter(s);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:11px}
.steps3 li + li::after{content:""}
.create{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:14px}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .purpose{flex-direction:row;align-items:center;padding:10px;box-shadow:none;gap:10px}
.plist .purpose .pi{width:34px;height:34px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tplc{border:0;border-radius:10px;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:7px}
.tplc .tt{position:relative;overflow:hidden;border-radius:8px;box-shadow:0 8px 22px -12px rgba(31,42,55,.5);background:var(--panel-2)}
.tplc .tt > .cv{position:absolute;left:0;top:0;transform-origin:0 0}

function checkEvent(k, ev, t, issues) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = ev.date ? new Date(ev.date + 'T00:00:00') : null;
  if (d && d < today) issues.push({ slot: k, level: 'error', msg: 'This event date has passed. Change the date, or make a thank-you post from the Events page.' });
  if (ev.date && HOLIDAYS[ev.date]) issues.push({ slot: k, level: 'warn', msg: `${fmtShort(ev.date)} is ${HOLIDAYS[ev.date]}. Turnout may be lower.` });
  const rows = ev.rows || [];
  if (rows.length > 2) issues.push({ slot: k, level: 'warn', msg: 'More than two extra rows makes the event block hard to read at a glance.' });
  for (const r of rows) {
    const name = r.type === 'custom' ? (r.label || 'custom') : EV_ROWS[r.type].label, v = r.value || '';

    if (r.type === 'registerBy') {
      const rb = new Date(v + 'T00:00:00');
      if (d && rb > d) issues.push({ slot: k, level: 'error', msg: 'The registration deadline is after the event.' });
      else if (rb < today) issues.push({ slot: k, level: 'warn', msg: 'The registration deadline has passed.' });
      continue;
    }
    if (v.length > 40) issues.push({ slot: k, level: 'error', msg: `The “${name}” row is ${v.length} characters. Keep rows under 40.` });
    if (r.type === 'custom' && (r.label || '').length > 14) issues.push({ slot: k, level: 'error', msg: 'Keep custom row labels to 14 characters.' });
    for (const fl of scanText(v, t.cat)) issues.push({ slot: k, level: fl.rule.sev, msg: `“${fl.match}”: ${fl.rule.why}` });
  }
}

/* ---------- Share caption ---------- */
function captionFor(cr) {
  const t = TPL[cr.templateId], c = { ...t.defaults, ...cr.content }, hidden = cr.hidden || [];
  const has = (k) => slotsOf(t).includes(k) && !hidden.includes(k);
  const lines = [];
  if (has('headline')) lines.push(c.headline);
  if (has('body')) lines.push(c.body);
  if (t.event && has('details') && c.details) lines.push(`${fmtDate(c.details.date)}, ${c.details.time}. ${c.details.venue}.`);
  const qr = (cr.extras || []).find((e) => e.kind === 'qr'); if (qr) lines.push(`Sign up: ${qr.link}`);
  if (has('cta') && t.cat !== 'greet') lines.push(`${c.cta}: message me at ${ADVISER.phone}.`);
  lines.push(`${ADVISER.name}, ${ADVISER.role}, AIA Singapore`);
  return lines.filter(Boolean).join('\n\n');
}

$('#brandMark').src = logoSrc('color');
loadAiaPhotos().catch(() => toast('Some brand photos could not load.')).then(() => { paintPresets(); boot(); });
function boot() {
  initHeaderStatic(); initEditorChrome();
  loadStore(); applyProfile();
  if (!store.posters.length) {
    store.posters = seedPosters();
    const sem = store.posters.find((p) => p.creative.templateId === 'event-seminar-01');
    store.events = sem ? { [sem.id]: { capacity: 40, guests: seedGuests(), scans: 64, reminded: null } } : {};
    const dp = store.posters.find((p) => p.name === 'Deepavali greeting'); if (dp) dp.shares = 3;
    const appr = store.posters.find((p) => p.status === 'approved');
    store.notes = [{ id: uid(), text: `Compliance approved “${appr.name}”. It is ready to share.`, at: appr.updated, poster: appr.id, read: false }];
    saveStore();
  }
  if ((store.seedV || 1) < 2) {
    const cr = newCreative('event-clarity-02', '1080x1350');
    Object.assign(cr.content, { eyebrow: 'Protection talk', headline: 'Protecting Your Family, Simply Explained', details: { date: '2026-09-12', time: '6.30pm to 9.00pm', venue: 'Hibiscus Room, 1 Robinson Road', rows: [{ type: 'language', value: 'English and Mandarin' }] } });
    const past = { id: uid(), name: 'Protection talk, 12 Sep', status: 'approved', created: Date.now() - 30 * 864e5, updated: Date.now() - 16 * 864e5, creative: cr, approvedSnapshot: clone(cr), shares: 4, versions: [{ seq: 1, label: 'Approved by Compliance', source: 'system', at: Date.now() - 20 * 864e5, snapshot: clone(cr), approved: true }] };
    store.posters.push(past);
    const g = seedGuests().slice(0, 14); g.forEach((x, n) => { x.at = Date.now() - (18 + n) * 864e5 / 4 - 14 * 864e5; if (n < 11) x.status = 'attended'; });
    store.events = store.events || {}; store.events[past.id] = { capacity: 30, guests: g, scans: 51, reminded: Date.now() - 15 * 864e5, page: { address: '1 Robinson Road, Singapore', postal: '048542', food: 'Tea provided' } };
    store.seedV = 2; saveStore();
  }
  showView('home');
  document.fonts.ready.then(() => { if (view === 'editor') { renderLibrary(); renderAll(); } else if (isWs()) renderPage(); else if (view === 'create') renderCreate(); });
  addEventListener('resize', () => { if (view === 'editor') renderLibrary(); });
}

if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then((s) => { if (s) { state.sample = s; renderInspector(); } }).catch(() => {});
  window.claude.use('downloads').then((d) => { if (d) state.downloads = d; }).catch(() => {});
}
})();
